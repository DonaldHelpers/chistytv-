name: Android

# Собирает приложение и гоняет тесты ядра. Готовый APK — во вкладке Actions → запуск → Artifacts.
# Это отладочная сборка со стандартной подписью: ставится на телефон, но не для публикации.
on:
  push:
    branches: [main, 'feature/**']
    paths: ['android/**', 'data/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Тесты ядра
        run: ./gradlew :core:test
      - name: Сборка APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChistyTV-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Выложить APK в Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk ChistyTV.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk ChistyTV.apk --prerelease --target "$GITHUB_SHA" \
            --title "ChistyTV: свежая сборка" \
            --notes "Отладочная сборка из ветки main. Скачайте ChistyTV.apk и установите на телефон."
