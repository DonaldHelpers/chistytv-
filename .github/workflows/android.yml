name: Android

# Собирает приложение и гоняет тесты ядра. Готовый APK — во вкладке Actions → запуск → Artifacts.
# Это отладочная сборка со стандартной подписью: ставится на телефон, но не для публикации.
on:
  push:
    branches: [main, 'feature/**']
    paths: ['android/**', 'data/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты ядра
        run: ./gradlew :core:test
      - name: Сборка APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChistyTV-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
